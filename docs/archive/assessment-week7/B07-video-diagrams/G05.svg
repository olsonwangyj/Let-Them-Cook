<svg viewBox="0 0 1040 570" role="img" aria-label="FireBeetle communication FSM" xmlns="http://www.w3.org/2000/svg"><title>FireBeetle communication FSM</title><defs><marker id="firebeetle-communication-fsm-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17324d"/></marker><marker id="firebeetle-communication-fsm-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker><marker id="firebeetle-communication-fsm-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#74899f"/></marker><marker id="firebeetle-communication-fsm-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1876bd"/></marker><marker id="firebeetle-communication-fsm-arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#007f8c"/></marker><marker id="firebeetle-communication-fsm-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7751bc"/></marker><marker id="firebeetle-communication-fsm-arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#eef4f8"/></marker><marker id="firebeetle-communication-fsm-arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker><marker id="firebeetle-communication-fsm-arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a76a10"/></marker></defs><rect width="1040" height="570" fill="#f8fbfd"/><rect x="15" y="85" width="220" height="115" rx="14" fill="#ffffff" stroke="#007f8c" stroke-width="2"/><text x="125.0" y="134.5" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="600">Advertising</text><text x="125.0" y="166.5" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="450">on power-up</text><rect x="400" y="85" width="250" height="115" rx="14" fill="#ffffff" stroke="#1876bd" stroke-width="2"/><text x="525.0" y="134.5" font-size="25" fill="#1876bd" text-anchor="middle" font-weight="600">Security pending</text><text x="525.0" y="166.5" font-size="25" fill="#1876bd" text-anchor="middle" font-weight="450">connected peer</text><rect x="805" y="85" width="220" height="115" rx="14" fill="#ffffff" stroke="#7751bc" stroke-width="2"/><text x="915.0" y="134.5" font-size="25" fill="#7751bc" text-anchor="middle" font-weight="600">Ready</text><text x="915.0" y="166.5" font-size="25" fill="#7751bc" text-anchor="middle" font-weight="450">authenticated</text><path d="M 235,143 L 400,143" fill="none" stroke="#1876bd" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-blue)"/><text x="320" y="117" font-size="22" fill="#17324d" text-anchor="middle" font-weight="500">Connect</text><path d="M 650,143 L 805,143" fill="none" stroke="#1876bd" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-blue)"/><text x="727" y="115" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Security OK</text><rect x="805" y="350" width="220" height="115" rx="14" fill="#ffffff" stroke="#007f8c" stroke-width="2"/><text x="915.0" y="399.5" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="600">Streaming</text><text x="915.0" y="431.5" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="450">32-byte samples</text><path d="M 915,200 L 915,350" fill="none" stroke="#007f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-cyan)"/><text x="760" y="263" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">Subscribed</text><text x="760" y="299" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">MTU ≥ 35</text><path d="M 525,85 L 525,28 L 125,28 L 125,85" fill="none" stroke="#a76a10" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-gold)"/><text x="310" y="19" font-size="21" fill="#a76a10" text-anchor="middle" font-weight="500">Authentication fails</text><path d="M 805,407 L 125,407 L 125,200" fill="none" stroke="#a76a10" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-gold)"/><text x="463" y="389" font-size="22" fill="#a76a10" text-anchor="middle" font-weight="500">Disconnect: clear state and advertise</text><path d="M 1025,388 L 1033,388 L 1033,477 L 915,477 L 915,465" fill="none" stroke="#007f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#firebeetle-communication-fsm-arr-cyan)"/><text x="520" y="515" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sensor notifications require an authenticated subscription.</text><text x="520" y="553" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Controls in this demo additionally require ATT MTU ≥ 64.</text></svg>
