<svg viewBox="0 0 1040 570" role="img" aria-label="Laptop and Ultra96 connection FSM" xmlns="http://www.w3.org/2000/svg"><title>Laptop and Ultra96 connection FSM</title><defs><marker id="laptop-and-ultra96-connection-fsm-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17324d"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#74899f"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1876bd"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#007f8c"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7751bc"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#eef4f8"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker><marker id="laptop-and-ultra96-connection-fsm-arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a76a10"/></marker></defs><rect width="1040" height="570" fill="#f8fbfd"/><rect x="20" y="80" width="235" height="112" rx="14" fill="#ffffff" stroke="#1876bd" stroke-width="2"/><text x="137.5" y="128.0" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="600">Connecting</text><text x="137.5" y="160.0" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="450">configured SSH route</text><rect x="380" y="80" width="280" height="112" rx="14" fill="#ffffff" stroke="#007f8c" stroke-width="2"/><text x="520.0" y="128.0" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="600">Verified TLS</text><text x="520.0" y="160.0" font-size="25" fill="#007f8c" text-anchor="middle" font-weight="450">CA + hostname</text><rect x="800" y="80" width="220" height="112" rx="14" fill="#ffffff" stroke="#7751bc" stroke-width="2"/><text x="910.0" y="128.0" font-size="25" fill="#7751bc" text-anchor="middle" font-weight="600">Active</text><text x="910.0" y="160.0" font-size="25" fill="#7751bc" text-anchor="middle" font-weight="450">send + ACK</text><path d="M 255,136 L 380,136" fill="none" stroke="#74899f" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-line)"/><path d="M 660,136 L 800,136" fill="none" stroke="#74899f" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-line)"/><rect x="370" y="345" width="300" height="100" rx="14" fill="#ffffff" stroke="#a76a10" stroke-width="2"/><text x="520.0" y="387.0" font-size="23" fill="#a76a10" text-anchor="middle" font-weight="600">Retire transport</text><text x="520.0" y="419.0" font-size="23" fill="#a76a10" text-anchor="middle" font-weight="450">retry delay capped at 5 s</text><path d="M 910,192 L 910,395 L 670,395" fill="none" stroke="#a76a10" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-gold)"/><text x="898" y="280" font-size="21" fill="#a76a10" text-anchor="middle" font-weight="500">Error / timeout</text><path d="M 137,192 L 137,307 L 520,307 L 520,345" fill="none" stroke="#a76a10" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-gold)"/><text x="333" y="292" font-size="22" fill="#a76a10" text-anchor="middle" font-weight="500">Connect or TLS failure</text><path d="M 370,395 L 65,395 L 65,192" fill="none" stroke="#a76a10" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-gold)"/><path d="M 940,80 L 940,30 L 730,30 L 730,138 L 800,138" fill="none" stroke="#7751bc" stroke-width="3" stroke-linejoin="round" marker-end="url(#laptop-and-ultra96-connection-fsm-arr-purple)"/><text x="578" y="26" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">Up to 32 in-flight messages per device</text><text x="520" y="505" font-size="22" fill="#17324d" text-anchor="middle" font-weight="500">ACK correlation: session + device + boot + seq + request ID</text><text x="520" y="549" font-size="23" fill="#a76a10" text-anchor="middle" font-weight="500">Sent but unconfirmed data is recorded as ambiguous loss.</text></svg>
