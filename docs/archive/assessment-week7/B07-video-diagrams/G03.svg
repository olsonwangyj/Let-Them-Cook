/defs><rect width="1040" height="570" fill="#f8fbfd"/><text x="520" y="24" font-size="25" fill="#17324d" text-anchor="middle" font-weight="500">Byte offsets in the BLE sensor value</text><text x="75.0" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">0–1</text><rect x="20" y="88" width="110" height="120" rx="0" fill="#f1f6fa" stroke="#007f8c" stroke-width="2"/><text x="75.0" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Magic</text><text x="75.0" y="177" font-size="23" fill="#007f8c" text-anchor="middle" font-weight="650">W7</text><text x="180.0" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">2</text><rect x="130" y="88" width="100" height="120" rx="0" fill="#f1f6fa" stroke="#1876bd" stroke-width="2"/><text x="180.0" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Version</text><text x="180.0" y="177" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="650">2</text><text x="280.0" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">3</text><rect x="230" y="88" width="100" height="120" rx="0" fill="#f1f6fa" stroke="#7751bc" stroke-width="2"/><text x="280.0" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Device</text><text x="280.0" y="177" font-size="23" fill="#7751bc" text-anchor="middle" font-weight="650">1 / 2</text><text x="405.0" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">4–7</text><rect x="330" y="88" width="150" height="120" rx="0" fill="#f1f6fa" stroke="#1876bd" stroke-width="2"/><text x="405.0" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Boot ID</text><text x="405.0" y="177" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="650">uint32</text><text x="555.0" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">8–11</text><rect x="480" y="88" width="150" height="120" rx="0" fill="#f1f6fa" stroke="#1876bd" stroke-width="2"/><text x="555.0" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Sequence</text><text x="555.0" y="177" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="650">uint32</text><text x="712.5" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">12–15</text><rect x="630" y="88" width="165" height="120" rx="0" fill="#f1f6fa" stroke="#1876bd" stroke-width="2"/><text x="712.5" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">Uptime</text><text x="712.5" y="177" font-size="23" fill="#1876bd" text-anchor="middle" font-weight="650">uint32 ms</text><text x="907.5" y="68" font-size="22" fill="#52657b" text-anchor="middle" font-weight="500">16–31</text><rect x="795" y="88" width="225" height="120" rx="0" fill="#f1f6fa" stroke="#007f8c" stroke-width="2"/><text x="907.5" y="132" font-size="21" fill="#17324d" text-anchor="middle" font-weight="500">8 channels</text><text x="907.5" y="177" font-size="23" fill="#007f8c" text-anchor="middle" font-weight="650">8 × int16</text><text x="520" y="250" font-size="25" fill="#17324d" text-anchor="middle" font-weight="500">32 bytes total     struct: &lt;2sBBIII8h&gt;     little-endian</text><text x="20" y="312" font-size="25" fill="#17324d" text-anchor="start" font-weight="600">Editable fixtures: randomly selected per v2 sample</text><rect x="20" y="336" width="1000" height="43" rx="4" fill="#f1f6fa" stroke="#e2eaf0" stroke-width="2"/><text x="40" y="366" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">[0, 0, 1000, 0, 0, 0, 10, 20]</text><rect x="20" y="383" width="1000" height="43" rx="4" fill="#ffffff" stroke="#e2eaf0" stroke-width="2"/><text x="40" y="413" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">[1200, -300, 850, 40, -20, 15, 600, 250]</text><rect x="20" y="430" width="1000" height="43" rx="4" fill="#f1f6fa" stroke="#e2eaf0" stroke-width="2"/><text x="40" y="460" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">[-700, 950, 400, -80, 60, 25, 100, 900]</text><rect x="20" y="477" width="1000" height="43" rx="4" fill="#ffffff" stroke="#e2eaf0" stroke-width="2"/><text x="40" y="507" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">[32767, -32768, -1, 0, 1, 123, -456, 789]</text><text x="520" y="560" font-size="24" fill="#7751bc" text-anchor="middle" font-weight="500">Sample identity = device_id + boot_id + seq</text></svg>
