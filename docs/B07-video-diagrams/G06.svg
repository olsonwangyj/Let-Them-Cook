nt-size="25" fill="#1876bd" text-anchor="middle" font-weight="450">get length</text><rect x="365" y="335" width="300" height="100" rx="14" fill="#ffffff" stroke="#1876bd" stroke-width="2"/><text x="515.0" y="377.0" font-size="25" fill="#1876bd" text-anchor="middle" font-weight="600">Check size</text><text x="515.0" y="409.0" font-size="25" fill="#1876bd" text-anchor="middle" font-weight="450">1 ≤ length ≤ 16384</text><rect x="780" y="335" width="240" height="100" rx="14" fill="#ffffff" stroke="#007f8c" stroke-width="2"/><text x="900.0" y="377.0" font-size="24" fill="#007f8c" text-anchor="middle" font-weight="600">readexactly(n)</text><text x="900.0" y="409.0" font-size="24" fill="#007f8c" text-anchor="middle" font-weight="450">get full body</text><path d="M 250,385 L 365,385" fill="none" stroke="#74899f" stroke-width="3" stroke-linejoin="round" marker-end="url(#tcp-framing-and-partial-delivery-arr-line)"/><path d="M 665,385 L 780,385" fill="none" stroke="#74899f" stroke-width="3" stroke-linejoin="round" marker-end="url(#tcp-framing-and-partial-delivery-arr-line)"/><path d="M 900,435 L 900,494 L 650,494" fill="none" stroke="#007f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#tcp-framing-and-partial-delivery-arr-cyan)"/><rect x="365" y="464" width="285" height="75" rx="14" fill="#ffffff" stroke="#7751bc" stroke-width="2"/><text x="507.5" y="509.5" font-size="23" fill="#7751bc" text-anchor="middle" font-weight="600">Parse and validate JSON</text><text x="185" y="518" font-size="23" fill="#52657b" text-anchor="middle" font-weight="500">Application framing</text></svg>
