<svg viewBox="0 0 1040 570" role="img" aria-label="Packet types and BLE controls" xmlns="http://www.w3.org/2000/svg"><title>Packet types and BLE controls</title><defs><marker id="packet-types-and-ble-controls-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17324d"/></marker><marker id="packet-types-and-ble-controls-arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker><marker id="packet-types-and-ble-controls-arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#74899f"/></marker><marker id="packet-types-and-ble-controls-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1876bd"/></marker><marker id="packet-types-and-ble-controls-arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#007f8c"/></marker><marker id="packet-types-and-ble-controls-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7751bc"/></marker><marker id="packet-types-and-ble-controls-arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#eef4f8"/></marker><marker id="packet-types-and-ble-controls-arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker><marker id="packet-types-and-ble-controls-arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a76a10"/></marker></defs><rect width="1040" height="570" fill="#f8fbfd"/><rect x="20" y="10" width="310" height="92" rx="14" fill="#ffffff" stroke="#007f8c" stroke-width="2"/><text x="175.0" y="48.0" font-size="24" fill="#007f8c" text-anchor="middle" font-weight="600">W7</text><text x="175.0" y="80.0" font-size="24" fill="#007f8c" text-anchor="middle" font-weight="450">Sensor notify: 32 bytes</text><rect x="365" y="10" width="310" height="92" rx="14" fill="#ffffff" stroke="#1876bd" stroke-width="2"/><text x="520.0" y="48.0" font-size="24" fill="#1876bd" text-anchor="middle" font-weight="600">W7S1</text><text x="520.0" y="80.0" font-size="24" fill="#1876bd" text-anchor="middle" font-weight="450">Source read: 24 bytes</text><rect x="710" y="10" width="310" height="92" rx="14" fill="#ffffff" stroke="#7751bc" stroke-width="2"/><text x="865.0" y="48.0" font-size="23" fill="#7751bc" text-anchor="middle" font-weight="600">B7</text><text x="865.0" y="80.0" font-size="23" fill="#7751bc" text-anchor="middle" font-weight="450">Control write + response</text><text x="20" y="150" font-size="25" fill="#17324d" text-anchor="start" font-weight="600">B7 control header: 14 bytes + type-specific payload</text><rect x="20" y="172" width="105" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="72.5" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">B7</text><rect x="125" y="172" width="105" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="177.5" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">v = 1</text><rect x="230" y="172" width="135" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="297.5" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">opcode</text><rect x="365" y="172" width="110" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="420.0" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">device</text><rect x="475" y="172" width="110" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="530.0" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">status</text><rect x="585" y="172" width="215" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="692.5" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">request ID</text><rect x="800" y="172" width="220" height="64" rx="0" fill="#f3eef9" stroke="#ad97cf" stroke-width="2"/><text x="910.0" y="213" font-size="22" fill="#7751bc" text-anchor="middle" font-weight="500">offset</text><text x="35" y="280" font-size="23" fill="#17324d" text-anchor="start" font-weight="600">0x01  Command</text><text x="435" y="280" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">32-byte v2 sensor payload</text><line x1="20" y1="295" x2="1020" y2="295" stroke="#c8d6e2" stroke-width="2"/><text x="35" y="331" font-size="23" fill="#17324d" text-anchor="start" font-weight="600">0x02  Rate</text><text x="435" y="331" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">uint16 target rate in Hz</text><line x1="20" y1="346" x2="1020" y2="346" stroke="#c8d6e2" stroke-width="2"/><text x="35" y="382" font-size="23" fill="#17324d" text-anchor="start" font-weight="600">0x10–0x13  File controls</text><text x="435" y="382" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Begin / chunk / end / abort</text><line x1="20" y1="397" x2="1020" y2="397" stroke="#c8d6e2" stroke-width="2"/><text x="35" y="433" font-size="23" fill="#17324d" text-anchor="start" font-weight="600">Response opcode</text><text x="435" y="433" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Request opcode with bit 7 set</text><line x1="20" y1="448" x2="1020" y2="448" stroke="#c8d6e2" stroke-width="2"/><text x="520" y="493" font-size="24" fill="#1876bd" text-anchor="middle" font-weight="650">TLS messages</text><text x="520" y="527" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">SENSOR_BATCH / INGEST_ACK</text><text x="520" y="562" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">SUBSCRIBE / SUBSCRIBED / GESTURE_RESULT</text></svg>
